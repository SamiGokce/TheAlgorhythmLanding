<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Algorhythm</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .mobile-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('background-mobile.png') center center / cover no-repeat;
      z-index: 0;
      animation: sway 14s ease-in-out infinite;
    }

    html {
      height: -webkit-fill-available;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    @keyframes sway {
      0%   { transform: translate(0px, 0px); }
      25%  { transform: translate(-5px, 4px); }
      50%  { transform: translate(4px, -4px); }
      75%  { transform: translate(-4px, -3px); }
      100% { transform: translate(0px, 0px); }
    }

    .bottom-nav {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(680px, 90vw);
      padding: 16px 48px;
      border-radius: 999px;

      /* liquid glass */
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);

      /* hover float animation */
      animation: float 3.6s ease-in-out infinite;
      overflow: visible;
    }

    @keyframes float {
      0%   { transform: translateX(-50%) translateY(0px); }
      50%  { transform: translateX(-50%) translateY(-8px); }
      100% { transform: translateX(-50%) translateY(0px); }
    }

    .nav-link {
      color: rgba(255, 255, 255, 0.85);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .nav-link:hover {
      color: #fff;
    }

    .waitlist-wrap {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .waitlist-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 22px;
      color: #fff;
      text-shadow:
        3px 3px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
      letter-spacing: 0.04em;
      image-rendering: pixelated;
    }

    .waitlist-input {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      border: 4px solid #fff;
      outline: none;
      padding: 20px 24px;
      width: 520px;
      letter-spacing: 0.05em;
      image-rendering: pixelated;
      box-shadow:
        6px 6px 0 #000,
        inset 2px 2px 0 rgba(255,255,255,0.1);
    }

    .waitlist-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .waitlist-input:focus {
      border-color: #fff;
      box-shadow:
        6px 6px 0 #000,
        0 0 0 2px rgba(255,255,255,0.2),
        inset 2px 2px 0 rgba(255,255,255,0.1);
    }

    .waitlist-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #000;
      background: #fff;
      border: none;
      padding: 20px 40px;
      cursor: pointer;
      letter-spacing: 0.06em;
      image-rendering: pixelated;
      box-shadow: 6px 6px 0 #555;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .waitlist-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 #555;
    }

    .waitlist-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0 #555;
    }

    .waitlist-success {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #7fff7f;
      text-shadow: 3px 3px 0 #000;
      display: none;
    }

    .bird {
      position: fixed;
      left: 20%;
      top: -300px;
      width: 180px;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
    }

    .bird.fly {
      animation: birdSwoop 1.1s cubic-bezier(0.4, 0, 0.8, 1) forwards;
    }

    @keyframes birdSwoop {
      0%   { top: -300px; left: 75%; opacity: 0.8; transform: rotate(20deg); }
      100% { top: 115vh;  left: 5%;  opacity: 0.8; transform: rotate(20deg); }
    }

    .curriculum-link {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      letter-spacing: 0.1em;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.4);
      transition: color 0.2s, border-color 0.2s;
    }
    .curriculum-link:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.6);
    }

    .nav-logo {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      height: 150px;
      width: auto;
      z-index: 100;
    }

    .pixel-game {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-top: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 -4px 24px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .game-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.1em;
    }

    #game-canvas {
      image-rendering: pixelated;
      cursor: pointer;
      display: block;
    }

    .game-stop-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: #000;
      background: #fff;
      border: none;
      padding: 7px 16px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #555;
      transition: transform 0.06s, box-shadow 0.06s;
      image-rendering: pixelated;
    }

    .game-stop-btn:active {
      transform: translate(2px,2px);
      box-shadow: 1px 1px 0 #555;
    }

    .game-result {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      height: 10px;
      letter-spacing: 0.05em;
    }

    /* ── Mobile ─────────────────────────────────────── */
    @media (max-width: 600px) {

      .pixel-game {
        display: none;
      }

      .waitlist-wrap {
        gap: 12px;
        width: 92vw;
        transform: translate(-50%, calc(-50% + 150px));
      }

      .nav-logo {
        top: 150px;
        height: 100px;
      }

      .waitlist-label {
        font-size: 9px;
        text-align: center;
        line-height: 1.8;
      }

      .waitlist-input {
        font-size: 16px;
        width: 88vw;
        padding: 13px 12px;
        border-width: 3px;
        box-shadow: 4px 4px 0 #000, inset 2px 2px 0 rgba(255,255,255,0.1);
      }

      .waitlist-btn {
        font-size: 8px;
        padding: 13px 22px;
        box-shadow: 4px 4px 0 #555;
      }

      .waitlist-btn:hover  { box-shadow: 6px 6px 0 #555; }
      .waitlist-btn:active { box-shadow: 1px 1px 0 #555; transform: translate(3px,3px); }

      .waitlist-success {
        font-size: 8px;
      }

      .bottom-nav {
        width: 94vw;
        padding: 12px 16px;
        bottom: 20px;
        gap: 10px;
      }

      .nav-link {
        font-size: 9px;
      }

      .bird {
        width: 110px;
      }
    }

    /* ── Very small phones ───────────────────────────── */
    @media (max-width: 380px) {
      .waitlist-label {
        font-size: 7px;
      }

      .waitlist-input {
        font-size: 16px;
        padding: 11px 10px;
      }

      .waitlist-btn {
        font-size: 7px;
        padding: 11px 18px;
      }

      .nav-link {
        font-size: 7px;
      }

      .nav-logo {
        height: 10000px;
      }
    }

  </style>
</head>
<body>
  <div class="mobile-bg"></div>

  <img class="bird" id="bird" src="bird.png" alt="">

  <div class="waitlist-wrap">
    <span class="waitlist-label">JOIN THE WAITLIST</span>
    <input class="waitlist-input" type="email" placeholder="your@email.com" id="waitlist-email">
    <button class="waitlist-btn" onclick="submitWaitlist()">SUBMIT</button>
    <span class="waitlist-success" id="waitlist-success">&gt;&gt; YOU'RE ON THE LIST!</span>
    <a href="/programs" class="curriculum-link">VIEW CURRICULUM &gt;&gt;</a>
  </div>

  <img class="nav-logo" src="logo.png" alt="Algorhythm">

  <div class="pixel-game">
    <span class="game-title">STOP THE LINE</span>
    <canvas id="game-canvas" height="20" style="width:100%;display:block"></canvas>
    <button class="game-stop-btn" id="game-stop-btn">STOP</button>
    <div style="display:flex;gap:16px;align-items:center;justify-content:center">
      <div class="game-result" id="game-result"></div>
      <div class="game-result" id="game-streak" style="color:#fff"></div>
    </div>
    <div id="game-lock" style="display:none;font-family:'Press Start 2P',monospace;font-size:7px;color:#fff;letter-spacing:0.05em;text-align:center">
      JOIN THE WAITLIST TO KEEP PLAYING
    </div>
  </div>

  <script>
    function playWhoosh() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = ctx.sampleRate * 0.6;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);

      const source = ctx.createBufferSource();
      source.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(800, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.55);
      filter.Q.value = 0.8;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);

      source.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      source.start();
      source.stop(ctx.currentTime + 0.6);
    }

    function submitWaitlist() {
      const input = document.getElementById('waitlist-email');
      const success = document.getElementById('waitlist-success');
      if (input.value && input.value.includes('@')) {
        input.style.display = 'none';
        document.querySelector('.waitlist-btn').style.display = 'none';
        success.style.display = 'block';
        window.waitlistSubmitted = true;
        if (window.unlockGame) window.unlockGame();

        // Submit to Google Form silently
        const formData = new FormData();
        formData.append('entry.646541989', input.value);
        fetch('https://docs.google.com/forms/d/e/1FAIpQLSfLUOK32YcHtYOMhOnMTyTysyp4G-MoKbIcpkz7EJ242ac00Q/formResponse', {
          method: 'POST',
          mode: 'no-cors',
          body: formData
        });

        const bird = document.getElementById('bird');
        bird.classList.remove('fly');
        void bird.offsetWidth; // reset animation
        bird.classList.add('fly');
        playWhoosh();
      } else {
        input.style.borderColor = '#ff5555';
        setTimeout(() => input.style.borderColor = '#fff', 600);
      }
    }

    document.getElementById('waitlist-email').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitWaitlist();
    });

    // ── Stop The Line Game (desktop only) ──────────────
    if (window.innerWidth > 600) {
      const gc = document.getElementById('game-canvas');
      gc.width = gc.offsetWidth;
      const gctx = gc.getContext('2d');
      const GW = gc.width, GH = gc.height;
      const PERFECT = 20, GOOD = 50;
      let gPos = 0, gDir = 1, gSpeed = 28, gStopped = false, gFrame, gStreak = 0, gHits = 0, gLocked = false;

      function drawGame() {
        gctx.clearRect(0, 0, GW, GH);

        // track
        gctx.fillStyle = 'rgba(255,255,255,0.12)';
        gctx.fillRect(0, 6, GW, 8);

        // good zone
        gctx.fillStyle = 'rgba(255,255,180,0.35)';
        gctx.fillRect(GW/2 - GOOD, 6, GOOD*2, 8);

        // perfect zone
        gctx.fillStyle = 'rgba(150,255,150,0.55)';
        gctx.fillRect(GW/2 - PERFECT, 6, PERFECT*2, 8);

        // cursor (4px wide pixel)
        gctx.fillStyle = '#fff';
        gctx.fillRect(Math.round(gPos) - 2, 2, 4, GH - 4);

        if (!gStopped) {
          gPos += gDir * gSpeed;
          if (gPos >= GW - 2) { gPos = GW - 2; gDir = -1; }
          if (gPos <= 2)      { gPos = 2;      gDir =  1; }
          gFrame = requestAnimationFrame(drawGame);
        }
      }

      function gameStop() {
        if (gStopped) {
          if (gLocked) return;
          gStopped = false;
          gSpeed = Math.min(gSpeed + 1, 40);
          document.getElementById('game-result').textContent = '';
          drawGame();
          return;
        }
        gStopped = true;
        cancelAnimationFrame(gFrame);

        const dist = Math.abs(gPos - GW / 2);
        const el = document.getElementById('game-result');
        const streakEl = document.getElementById('game-streak');
        const lockEl = document.getElementById('game-lock');
        if (dist < PERFECT) {
          gStreak++; gHits++;
          el.textContent = 'PERFECT!'; el.style.color = '#7fff7f';
        } else if (dist < GOOD) {
          gStreak++; gHits++;
          el.textContent = 'GOOD';    el.style.color = '#ffff88';
        } else {
          gStreak = 0;
          el.textContent = 'MISS';    el.style.color = '#ff7777';
          gSpeed = Math.max(gSpeed - 1, 28);
        }
        streakEl.textContent = gStreak > 1 ? 'STREAK ' + gStreak : '';

        if (gHits === 1 && !window.waitlistSubmitted) {
          gLocked = true;
          lockEl.style.display = 'block';
          document.getElementById('game-stop-btn').disabled = true;
          document.getElementById('game-stop-btn').style.opacity = '0.3';
        }
      }

      document.getElementById('game-stop-btn').addEventListener('click', gameStop);
      gc.addEventListener('click', gameStop);
      document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' && document.activeElement !== document.getElementById('waitlist-email')) {
          e.preventDefault(); gameStop();
        }
      });

      window.unlockGame = function() {
        gLocked = false;
        gStopped = false;
        document.getElementById('game-lock').style.display = 'none';
        document.getElementById('game-stop-btn').disabled = false;
        document.getElementById('game-stop-btn').style.opacity = '1';
        document.getElementById('game-result').textContent = '';
        drawGame();
      };

      drawGame();
    } else {
      document.querySelector('.pixel-game').style.display = 'none';
    }
  </script>
</body>
</html>
